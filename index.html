<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f2f2ef"><meta name="description" content="An interactive three-dimensional material sample drawer."><title>The Sample Room</title>
<link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="archive-3d.css?v=hanging-4"><link rel="stylesheet" href="acrylic.css?v=case-6"><link rel="stylesheet" href="category-stack.css?v=stack-7"><link rel="stylesheet" href="cabinet.css?v=extension-10"><script src="category-drawers.js?v=extension-10" defer></script><script src="file-wave.js?v=case-6" defer></script><script src="app.js?v=extension-10" defer></script>
</head>
<body><a href="./" class="drawer-logo" aria-label="The Sample Room"><svg viewBox="0 0 78 32" aria-hidden="true"><path d="M3 3h72v26H3zM3 12h72M3 21h72M32 7.5h14M32 16.5h14M32 25h14"/></svg></a>
<button id="boardToggle" class="round-control board-toggle" aria-label="Open saved samples"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg><i id="boardDot" hidden></i></button>
<main id="scrollTrack"><div class="drawer-stage" id="fileScene" role="group" aria-label="Material sample drawer. Scroll or use arrow keys to browse; select a sample to pull it out.">
<div class="ground-shadow" aria-hidden="true"></div><div class="drawer-camera"><div class="drawer-world" id="drawerWorld">
<div class="case-box case-timber drawer-floor" aria-hidden="true" style="--bx:400px;--by:660px;--bz:-9px;--bw:800px;--bh:1320px;--bd:18px"><span class="box-face box-top"></span><span class="box-face box-bottom"></span><span class="box-face box-left"></span><span class="box-face box-right"></span><span class="box-face box-near"></span><span class="box-face box-far"></span></div>
<div class="case-box case-timber drawer-wall drawer-rear" aria-hidden="true" style="--bx:400px;--by:9px;--bz:120px;--bw:764px;--bh:18px;--bd:240px"><span class="box-face box-top"></span><span class="box-face box-bottom"></span><span class="box-face box-left"></span><span class="box-face box-right"></span><span class="box-face box-near"></span><span class="box-face box-far"></span></div>
<div class="case-box case-timber drawer-wall drawer-left" aria-hidden="true" style="--bx:9px;--by:660px;--bz:120px;--bw:18px;--bh:1320px;--bd:240px"><span class="box-face box-top"></span><span class="box-face box-bottom"></span><span class="box-face box-left"></span><span class="box-face box-right"></span><span class="box-face box-near"></span><span class="box-face box-far"></span></div>
<div class="case-box case-timber drawer-wall drawer-right" aria-hidden="true" style="--bx:791px;--by:660px;--bz:120px;--bw:18px;--bh:1320px;--bd:240px"><span class="box-face box-top"></span><span class="box-face box-bottom"></span><span class="box-face box-left"></span><span class="box-face box-right"></span><span class="box-face box-near"></span><span class="box-face box-far"></span></div>
<div class="case-box case-timber drawer-wall drawer-front" aria-hidden="true" style="--bx:400px;--by:1311px;--bz:120px;--bw:764px;--bh:18px;--bd:240px"><span class="box-face box-top"></span><span class="box-face box-bottom"></span><span class="box-face box-left"></span><span class="box-face box-right"></span><span class="box-face box-near"></span><span class="box-face box-far"></span></div>
<div class="case-box case-metal handle-mount handle-mount-left" aria-hidden="true" style="--bx:260px;--by:1340px;--bz:120px;--bw:18px;--bh:40px;--bd:18px"><span class="box-face box-top"></span><span class="box-face box-bottom"></span><span class="box-face box-left"></span><span class="box-face box-right"></span><span class="box-face box-near"></span><span class="box-face box-far"></span></div>
<div class="case-box case-metal handle-mount handle-mount-right" aria-hidden="true" style="--bx:540px;--by:1340px;--bz:120px;--bw:18px;--bh:40px;--bd:18px"><span class="box-face box-top"></span><span class="box-face box-bottom"></span><span class="box-face box-left"></span><span class="box-face box-right"></span><span class="box-face box-near"></span><span class="box-face box-far"></span></div>
<div class="case-box case-metal drawer-handle" aria-hidden="true" style="--bx:400px;--by:1360px;--bz:120px;--bw:310px;--bh:18px;--bd:18px"><span class="box-face box-top"></span><span class="box-face box-bottom"></span><span class="box-face box-left"></span><span class="box-face box-right"></span><span class="box-face box-near"></span><span class="box-face box-far"></span></div>
<div class="file-rack" id="files"></div>
</div></div>
<nav class="drawer-controls" aria-label="Browse samples"><button class="round-control" id="previousFile" aria-label="Previous sample"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 14 4-4 4 4"/></svg></button><span class="scroll-mark" aria-hidden="true"><i></i></span><button class="round-control" id="nextFile" aria-label="Next sample"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg></button></nav>
<span id="currentAnnouncement" class="sr-only" aria-live="polite"></span></div></main>
<dialog id="sampleDialog" class="sample-dialog"><button class="round-control close-button" data-close="sampleDialog" aria-label="Close sample"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button><div id="sampleDetail"></div></dialog>
<dialog id="boardDialog" class="board-dialog" aria-label="Saved material samples"><button class="round-control close-button" data-close="boardDialog" aria-label="Close saved samples"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button><div id="boardItems" class="board-items"></div><div class="board-actions"><button id="downloadBoard" class="round-control" aria-label="Download material board"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v12m-5-5 5 5 5-5M5 19h14"/></svg></button><button id="clearBoard" class="round-control" aria-label="Clear saved samples"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13M10 10v7m4-7v7"/></svg></button></div></dialog>
<div id="toast" class="sr-only" role="status" aria-live="polite"></div>
</body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eeeae2"><meta name="description" content="A three-dimensional material library. Browse four drawers or bring your own local materials."><title>The Sample Room</title>
<link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="room-3d.css?v=webgl-1">
<script type="module" src="room.js?v=webgl-1"></script>
</head>
<body>
<main id="scrollTrack"><div id="stage"><canvas id="scene" tabindex="0" aria-label="3D material cabinet. Scroll to browse, drag to rotate, and select a material to inspect it."></canvas></div></main>
<a class="drawer-logo" href="./" aria-label="The Sample Room"><svg viewBox="0 0 78 32"><path d="M3 3h72v26H3zM3 12h72M3 21h72M32 7.5h14M32 16.5h14M32 25h14"/></svg></a>
<nav class="top-tools" aria-label="Material library">
<button id="importToggle" class="round" aria-label="Import local materials" title="Your materials"><svg viewBox="0 0 24 24"><path d="M3 6h7l2 2h9v12H3zM12 11v6m-3-3h6"/></svg><i id="localDot" hidden></i></button>
<button id="boardToggle" class="round" aria-label="Open saved samples" title="Saved samples"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg><i id="boardDot" hidden></i></button>
</nav>
<nav id="categories" class="categories" aria-label="Sample collections">
<button class="round" data-category="3" aria-label="Open foam blocks" title="Blocks"><svg viewBox="0 0 24 24"><path d="m4 8 8-4 8 4v9l-8 4-8-4zM4 8l8 4 8-4m-8 4v9"/></svg></button>
<button class="round" data-category="2" aria-label="Open slanted samples" title="Sample case"><svg viewBox="0 0 24 24"><path d="m3 10 9-4 9 4v10H3zM3 10l9 4 9-4M5 9V3h14v6"/></svg></button>
<button class="round" data-category="1" aria-label="Open sample binder" title="Binder"><svg viewBox="0 0 24 24"><path d="M5 4h15v16H5zM8 4v16M3 8h4m-4 4h4m-4 4h4"/></svg></button>
<button class="round" data-category="0" aria-label="Open acrylic samples" title="Acrylic"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="10" height="14"/><path d="M9 7h10v13H9"/></svg></button>
</nav>
<nav class="view-tools" aria-label="3D view">
<button id="rotateView" class="round" aria-label="Rotate view" aria-pressed="false" title="Rotate view"><svg viewBox="0 0 24 24"><path d="M4 11a8 8 0 1 1 3 7M4 4v7h7"/><path d="m9 13 3-2 3 2v4l-3 2-3-2z"/></svg></button>
<button id="resetView" class="round" aria-label="Reset axonometric view" title="Reset view"><svg viewBox="0 0 24 24"><path d="m4 8 8-4 8 4v9l-8 4-8-4zM4 8l8 4 8-4m-8 4v9"/></svg></button>
<button id="zoomOut" class="round" aria-label="Zoom out" title="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button><button id="zoomIn" class="round" aria-label="Zoom in" title="Zoom in"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
</nav>
<nav class="browse-tools" aria-label="Browse materials"><button id="previous" class="round" aria-label="Previous sample or page"><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></button><span id="counter" aria-live="polite"></span><button id="next" class="round" aria-label="Next sample or page"><svg viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></svg></button></nav>
<aside id="peek" hidden><strong></strong><span></span></aside><div id="toast" role="status" hidden></div>
<div id="loading" role="status">Opening the cabinet…</div><div id="fallback" hidden><p>3D isn’t available in this browser.</p><button id="retry3d">Try again</button><div id="fallbackSamples"></div></div>
<div id="accessibleSamples" class="sr-only" aria-label="Materials in the open drawer"></div>
<dialog id="importDialog" aria-labelledby="importTitle" class="library-dialog"><button class="round close" data-close="importDialog" aria-label="Close local materials">×</button><h1 id="importTitle">Your materials</h1><p class="muted">Choose images or a folder. Stored only in this browser.</p><div class="import-actions"><button id="chooseFiles" class="pill">Add images</button><button id="chooseFolder" class="pill">Choose folder</button></div><input id="fileInput" type="file" multiple accept="image/jpeg,image/png,image/webp,image/avif,image/gif,image/bmp" hidden><input id="folderInput" type="file" webkitdirectory multiple hidden><div id="dropZone" tabindex="0">Drop material images here</div><p id="importStatus" role="status"></p><label class="source-label">Showing<select id="sourceSelect"><option value="builtins">Sample collection</option><option value="local">My materials</option></select></label><div id="localGrid" class="local-grid"></div><p id="localEmpty" class="muted">No local materials yet.</p></dialog>
<dialog id="sampleDialog" class="sample-dialog"><button class="round close" data-close="sampleDialog" aria-label="Close sample">×</button><img id="detailImage" alt=""><div class="detail-footer"><div><h2 id="detailName"></h2><p id="detailMeta" class="muted"></p></div><button id="detailSave" class="round" aria-label="Save sample" aria-pressed="false">+</button></div></dialog>
<dialog id="boardDialog" class="library-dialog" aria-label="Saved samples"><button class="round close" data-close="boardDialog" aria-label="Close saved samples">×</button><h1>Saved samples</h1><div id="boardItems" class="local-grid"></div><div class="import-actions"><button id="downloadBoard" class="pill">Export board</button><button id="clearBoard" class="pill">Clear</button></div></dialog>
<noscript><p>This material library needs JavaScript.</p></noscript>
</body></html>
